name: Bug report
description: Something doesn't work, or works differently than the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please don't paste anything private: log files
        hold no transcripts unless you turned on `privacy.log_transcripts`, but check
        what you paste anyway.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
      placeholder: |
        I held Ctrl+Win in Notepad and said "...". I expected "...", but got "...".
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `keynone doctor`
      description: Run `.venv\Scripts\keynone.exe doctor` in the Keynone folder and paste the result.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Keynone version and edition
      description: Shown on the About page of the settings window, e.g. "0.2.0 - Keynone + languages".
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and the app you dictated into
      placeholder: Windows 11 24H2, Chrome
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From `data/logs/` (listener.log, engine.log, settings.log), around the time it happened.
      render: text
