# Keynone settings.
# This file is copied to data/config.toml on first run - edit that copy, here or
# in the settings window (keynone settings, or Settings... in the tray menu).
# A running Keynone picks up saved changes within a second (never mid-dictation).

[hotkeys]
# Hold to dictate, release to insert the polished text.
# Double-tap to start hands-free mode; tap once more to finish.
# Examples: "ctrl+win", "rctrl", "capslock", "ctrl+alt+space", "f9", "ctrl+shift+d"
dictate = "ctrl+win"
# Speak-to-edit: select text in any app, hold this and say how to change it
# ("make it shorter", "more formal", "translate to Spanish"). "" disables it.
edit = "ctrl+win+alt"
# Discards the current dictation.
cancel = "esc"
# A press shorter than this counts as a "tap" (used for double-tap hands-free).
hold_threshold_ms = 300
double_tap_ms = 400

[lifecycle]
# Seconds to keep the speech engine loaded (idle: 0% CPU, ~2 GB RAM) after a
# dictation so the next one starts instantly; afterwards it exits completely and
# only the small hotkey listener remains (0% CPU, no microphone, no models).
# 0 = strict on-demand: the engine exits right after every dictation, so every
# dictation pays the ~5 s model load (audio is buffered - nothing is lost, but
# the live text appears late).
keep_warm_seconds = 300

[audio]
# Part of the microphone name to use; empty = Windows default input device.
device = ""
# Short start/stop sounds.
cues = true
# Hard limit for one dictation.
max_session_seconds = 600
# Hands-free mode stops by itself after this much silence (0 = never).
handsfree_silence_stop_seconds = 0
# Boost a quiet or distant microphone (up to +30 dB) before speech recognition.
normalize_level = true

[asr]
model = "nemotron-en-560ms-int8"
# "en"   - English (most accurate English model)
# "auto" - detect the language (40 locales incl. Hindi, Spanish, French, German,
#          Italian, Portuguese, Russian, Japanese, Korean, Chinese, Arabic ...)
# "hi", "es", "de", ... - one fixed language (most accurate for that language)
# Anything but "en" uses the multilingual model:
#   keynone setup --with nemotron3.5-multi-560ms-int8
language = "en"
threads = 4
# Pause length that closes a sentence for early background polishing.
endpoint_silence_seconds = 0.8

[cleanup]
# "auto"   - local LLM only when the text needs it (self-corrections, lists, fillers like "you know")
# "always" - every dictation is polished by the LLM (slightly slower)
# "off"    - fast rule-based cleanup only (fillers, stutters, voice commands)
llm_mode = "auto"
remove_fillers = true
# Spoken "new line", "new paragraph", "scratch that".
voice_commands = true
# If the LLM is slower than this, the rule-based text is used instead.
llm_timeout_seconds = 4.0
# Write every dictation in another language, e.g. "English", "Spanish", "hi".
# "" = off. Best with the Qwen3.5 2B model (keynone setup --with qwen3.5-2b-q4km).
translate_to = ""

[llm]
model = "lfm2.5-1.2b-instruct-q4km"
threads = 4
# Tokens per request slot (one slot cleans up, one rewrites selected text).
context = 4096
# GPU acceleration for the language model (polishing and speak-to-edit):
# "off" (CPU), "auto" (best GPU, e.g. NVIDIA GTX 1650) or part of a device name.
# Needs: keynone setup --with llama.cpp-b11398-vulkan-x64
gpu = "off"
gpu_layers = 99

[insert]
# "paste": via clipboard (fast, handles any text; your clipboard is restored afterwards)
# "type" : simulated keystrokes (for apps that block paste)
method = "paste"
paste_keys = "ctrl+v"
# Used by speak-to-edit to read the selection when UI Automation can't.
copy_keys = "ctrl+c"
restore_clipboard = true
restore_delay_ms = 400
trailing_space = true
# Look at the text around the cursor: no capital letter mid-sentence, no double
# spaces, a space after a word, no extra period before following text.
smart_spacing = true

[edit]
# Speak-to-edit (hotkeys.edit): give up after this long.
timeout_seconds = 30.0
max_selection_chars = 8000

[overlay]
enabled = true
# "bottom" or "top" of the screen that has the active window.
position = "bottom"
opacity = 0.94

[history]
# Local history of dictations in data/history.db (never leaves this folder).
enabled = true
retention_days = 30

[privacy]
# Write transcript text into log files (for debugging only).
log_transcripts = false

[dictionary]
# Names and jargon spelled your way. Also given to the LLM as spelling hints.
words = []

[dictionary.replacements]
# "chat gpt" = "ChatGPT"
# "post gres" = "Postgres"

# Per-app behaviour. The first profile whose `match` (process name) or
# `title_match` (window-title substring) matches the active window wins.
# Built-in profiles for chat apps, e-mail and code editors/terminals apply
# after yours. Fields: style ("default" | "chat" | "email" | "code"), method,
# paste_keys, copy_keys, trailing_space, llm_mode, drop_final_period.
#
# [[apps]]
# name = "my-terminal"
# match = ["mintty.exe"]
# paste_keys = "shift+insert"
# style = "code"
